# ============================================================
#  樱隧 Sakura Tunnel · 客户端配置样例
#  注意：TOML 里 [table] 之后的内容都属于该 table，
#        所以 [auth] / [transport.tls] / [log] 段之后的 [[proxies]] 要单独开
# ============================================================

serverAddr = "1.2.3.4"
serverPort = 7443

# 租户身份（管理员在面板「用户」里分配）
user = "alice"
loginFailExit = false

[auth]
method = "user"
token = "sk_xxxxxxxxxxxxxxxx"

[transport.tls]
enable = true

[log]
to = "console"
level = "info"

# 一条隧道：把本机 22 端口映射到服务器 6000
[[proxies]]
name = "alice-ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000

# 再来一条：本机 8080 -> 服务器 6001，该隧道自限 1MB/s
# （服务端还会叠加用户级限额，两者取更小的那个）
[[proxies]]
name = "alice-web"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8080
remotePort = 6001
transport.bandwidthLimit = "1MB"
transport.bandwidthLimitMode = "server"
